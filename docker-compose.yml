services:
  postgres:
    image: postgres:16-alpine
    container_name: template-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nest}
      POSTGRES_DB: ${DB_NAME:-nest}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-nest} -d ${DB_NAME:-nest}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: template-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: template-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-nest}
      DB_USERNAME: ${DB_USERNAME:-nest}
      DB_PASSWORD: ${DB_PASSWORD:-nest}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      DOMAIN: ${DOMAIN:-3000}
    ports:
      - "${DOMAIN:-3000}:${DOMAIN:-3000}"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  redis_data:
  uploads_data: